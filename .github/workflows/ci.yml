name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the integration tests. The suites TRUNCATE tables,
    # so they must NEVER point at a real database — this one is isolated to the
    # job and discarded when it finishes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pastapet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pastapet_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pastapet_test
      JWT_SECRET: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Apply migrations to the test database
        run: npm run migrate:deploy

      - name: Test
        run: npm test

      # Informational for now (non-blocking): there is a known deferred
      # node-cron 3->4 breaking fix. Flip continue-on-error to false once the
      # audit is clean to make high/critical advisories block merges.
      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high
